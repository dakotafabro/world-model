[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-world-model"
version = "0.1.0"
description = "MCP server for querying, scaffolding, and maintaining five-layer world models"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.13.0",
    "pyyaml>=6.0",
]

[project.scripts]
mcp_world_model = "mcp_world_model.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_world_model"]
